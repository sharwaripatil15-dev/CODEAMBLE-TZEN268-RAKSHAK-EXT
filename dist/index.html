<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rakshak Sentinel — Web3 Pre-Signing Security</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        background-color: #05070D;
        color: #F8FAFC;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      .loader-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 2px solid rgba(6, 182, 212, 0.15);
        border-top: 2px solid #06B6D4;
        border-radius: 50%;
        animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .title {
        font-size: 13px;
        font-family: 'JetBrains Mono', monospace;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #94A3B8;
      }
    </style>
    <script>
      window.location.replace('/test_dapp.html');
    </script>
  </head>
  <body>
    <div class="loader-container">
      <div class="spinner"></div>
      <div class="title">Initializing Rakshak Sentinel...</div>
    </div>
  </body>
</html>
